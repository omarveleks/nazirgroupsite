# Build, run the full QA gate, then deploy to Cloudflare Pages.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Pages:Edit) and CLOUDFLARE_ACCOUNT_ID.
# Optional repository variables: CF_PAGES_PROJECT (default nazir-and-company),
# SITE_MODE (review|live, default review), PUBLIC_SITE_URL, PUBLIC_FORM_ENABLED,
# PUBLIC_TURNSTILE_SITE_KEY.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, claude/gallant-knuth-fh3j1q]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  qa-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SITE_MODE: ${{ vars.SITE_MODE || 'review' }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://nazir-and-company.pages.dev' }}
      PUBLIC_FORM_ENABLED: ${{ vars.PUBLIC_FORM_ENABLED || 'false' }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY || '' }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'nazir-and-company' }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: QA gate (builds the deployable artefact last)
        run: npm run qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report
          path: |
            QA_REPORT.md
            qa/results.json
            qa/lighthouse/
      - name: Create the Pages project if it does not exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create "$CF_PAGES_PROJECT" --production-branch=main || true
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name="$CF_PAGES_PROJECT" --branch=main --commit-dirty=true
